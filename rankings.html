<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify top 49 Rankings</title>
    <link href="rankings.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <center>
    <header>
	    <h1>Spotify top 49: Rankings</h1>
	</header>

	<label>Rank</label>
    <select id="rank">
        
    </select>
    <br>
    <br>

    <!-- calls the getResultsB function to find the song and artist -->
    <button id="findButton" onclick="getResultsB(document.getElementById('rank').value)">Find Song and Artist!</button> 

    <div class="clearButton">
        <!-- calls the clearButton() to reset the output box -->
        <button id ="clear" onclick="clearButton()">Clear</button>
    </div>

    <h2>Results</h2>
    <div id = "outputBox" class="outputBox">

	  </div>

    <div>
        <!-- calls the findByArtist() function to travel to the artist html -->
        <button class="artistButton" onclick="findByArtist()">Find songs by Artist</button>
        <!-- calls the game() function to travel to the minigame html -->
        <button id="minigame" onclick="game()">Mini Game</button>
    </div>
    

  </center>


    <script src="utils.js"></script>
    <script src="rankingsScript.js"></script>
</body>
</html>
